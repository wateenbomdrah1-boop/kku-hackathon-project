/* Premium Vision 2030 visual system */
:root{--vision-deep:#031b16;--vision-surface:rgba(4,29,23,.79);--vision-surface-strong:rgba(3,23,18,.91);--vision-border:rgba(213,255,239,.2);--vision-text:#f5fffb;--vision-muted:#c4ddd4;--vision-teal:#2fd6ac;--vision-teal-bright:#7af4d4;--vision-teal-dark:#096b56;--vision-focus:#b8ffe9;--vision-shadow:0 24px 64px rgba(0,8,6,.48);--vision-error:#ffb4a9;--vision-error-border:#ff8174;color:var(--vision-text);background:var(--vision-deep)}
body{min-height:100dvh;color:var(--vision-text);background:linear-gradient(115deg,rgba(0,12,9,.94),rgba(4,42,33,.84) 52%,rgba(0,13,10,.93)),url("vision2030-background.jpeg") center/cover fixed no-repeat;background-color:var(--vision-deep);isolation:isolate}
body::after{content:"";position:fixed;z-index:0;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 20%,rgba(94,255,211,.14),transparent 18%),radial-gradient(circle at 86% 72%,rgba(48,216,173,.11),transparent 20%),radial-gradient(circle at 50% 5%,rgba(220,255,244,.08),transparent 16%);animation:vision-ambient 16s ease-in-out infinite alternate}
body.welcome-view{min-height:100dvh;background:linear-gradient(115deg,rgba(0,12,9,.94),rgba(4,42,33,.84) 52%,rgba(0,13,10,.93)),url("vision2030-background.jpeg") center/cover fixed no-repeat;background-color:var(--vision-deep)}
.wrap{position:relative;z-index:1}.brand,body.welcome-view .brand,body.welcome-view .credit,body.welcome-view #foot{color:var(--vision-text);text-shadow:0 2px 14px rgba(0,0,0,.45)}.brand{letter-spacing:.01em}.credit,.small,body.welcome-view .credit,body.welcome-view #foot{color:var(--vision-muted)}
.panel,body.welcome-view .panel{background:var(--vision-surface);border:1px solid var(--vision-border);box-shadow:var(--vision-shadow),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);color:var(--vision-text)}
.pill{min-height:44px;border-color:rgba(122,244,212,.42);background:rgba(3,30,24,.7);color:var(--vision-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.eyebrow{color:var(--vision-teal-bright);text-shadow:0 1px 10px rgba(47,214,172,.25)}.h1,.field-label{color:var(--vision-text)}.sub{color:#e4f5ef}.small,.muted{color:var(--vision-muted)}.required{color:var(--vision-teal-bright)}
.progress{background:rgba(213,255,239,.15);box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}.fill{background:linear-gradient(90deg,var(--vision-teal-dark),var(--vision-teal),var(--vision-teal-bright));box-shadow:0 0 14px rgba(47,214,172,.55)}
.btn{min-height:48px;background:linear-gradient(135deg,#08755f,#15977a);color:#f7fffc;box-shadow:0 10px 22px rgba(0,35,27,.34),inset 0 1px 0 rgba(255,255,255,.16)}.btn:hover:not(:disabled){background:linear-gradient(135deg,#11977a,#2fd6ac);box-shadow:0 13px 28px rgba(0,35,27,.45),0 0 18px rgba(47,214,172,.2)}.btn:active:not(:disabled),.pill:active,.opt:active,.colorchoice:active{transform:translateY(1px) scale(.985)}.btn:disabled{opacity:.48}.secondary{background:rgba(217,255,241,.12);color:var(--vision-text);border:1px solid rgba(213,255,239,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}.secondary:hover:not(:disabled){background:rgba(47,214,172,.24)}
.opt,.colorchoice{position:relative;overflow:hidden;border-color:rgba(213,255,239,.21);background:rgba(2,24,19,.62);color:var(--vision-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.opt:hover,.colorchoice:hover{border-color:rgba(122,244,212,.76);background:rgba(12,78,61,.66);box-shadow:0 10px 24px rgba(0,10,7,.25),inset 0 1px 0 rgba(255,255,255,.09)}.opt.selected,.colorchoice.selected{border-color:var(--vision-teal-bright);background:rgba(16,111,87,.7);box-shadow:0 0 0 1px rgba(122,244,212,.22),0 10px 25px rgba(0,13,10,.24)}.letter{background:rgba(122,244,212,.16);color:var(--vision-teal-bright)}.opt.selected .letter{background:var(--vision-teal);color:#03241c}.colorname{color:var(--vision-text)}
.input{border-color:rgba(213,255,239,.28);background:rgba(0,17,13,.56);color:var(--vision-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.input::placeholder{color:#b8cec5}.input:focus{border-color:var(--vision-teal-bright);box-shadow:0 0 0 3px rgba(122,244,212,.24),inset 0 1px 0 rgba(255,255,255,.05)}.input[aria-invalid=true]{border-color:var(--vision-error-border);box-shadow:0 0 0 3px rgba(255,129,116,.18)}.field-error{color:var(--vision-error)}
.pill:focus-visible,.btn:focus-visible,.opt:focus-visible,.colorchoice:focus-visible,.match-card-back:focus-visible,.sources summary:focus-visible,.sources a:focus-visible,.job-list a:focus-visible{outline:3px solid var(--vision-focus);outline-offset:3px}
.result{background:rgba(2,25,19,.7);color:var(--vision-text);border-color:var(--vision-teal)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.result-intro .h1{color:var(--vision-text)}.intro-orb{box-shadow:0 14px 38px color-mix(in srgb,var(--sector),transparent 55%),0 0 32px rgba(47,214,172,.22)}
.bar{background:rgba(213,255,239,.16)}.score-chart,.sources{border-color:var(--vision-border);background:rgba(2,25,19,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.score-chart h2,.sources summary,.score-line strong,.all-score-row strong{color:var(--vision-text)}.score-line,.all-score-row>div:first-child{color:var(--vision-muted)}.sources ul{color:var(--vision-muted)}.sources a,.job-list a{color:var(--vision-teal-bright)}.sources a:hover,.job-list a:hover{color:#fff}.job-list li{border-color:rgba(213,255,239,.16)}.job-list span{color:var(--vision-muted)}.sources em{color:#ffd0c9}
.match-card-front{border-color:rgba(213,255,239,.22);background:var(--vision-surface-strong);box-shadow:var(--vision-shadow),inset 0 1px 0 rgba(255,255,255,.08)}.match-card-front .rank-badge{background:rgba(47,214,172,.17);color:var(--vision-teal-bright);border:1px solid rgba(122,244,212,.22)}.match-card-front h2,.match-card-front h3,.match-card-front .score-line strong{color:var(--vision-text)}.match-card-front p,.match-card-front .score-line{color:var(--vision-muted)}.match-card-front .sector-character{background:rgba(3,27,22,.9)}
.match-card-back{background:radial-gradient(circle at 18% 18%,rgba(47,214,172,.26),transparent 30%),radial-gradient(circle at 82% 82%,rgba(202,164,72,.14),transparent 34%),linear-gradient(145deg,#031b16,#075440 56%,#061c19)}.card-back-pattern{border-color:rgba(185,255,232,.28);background:repeating-linear-gradient(135deg,transparent 0 17px,rgba(185,255,232,.06) 18px 19px),radial-gradient(circle at 50% 50%,transparent 0 26%,rgba(185,255,232,.08) 27% 28%,transparent 29%)}.back-rank{border-color:rgba(217,255,240,.5);color:#e1fff6}.card-back-copy{color:#d8eee7}.reveal-match{background:#e8fff6;color:#063b2e}.match-card-back:hover .reveal-match{background:#fff}
#app>.eyebrow,#app>.h1,#app>.sub,#app>.small,#app>.progress,#app>.opt,#app>.colorgrid,#app>.actions,.welcome-form,.result-intro{animation:vision-arrive .34s ease-out both}
button,.pill,.opt,.colorchoice,.input,.sources summary,.sources a,.job-list a{touch-action:manipulation;transition:background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease,opacity .18s ease}
.tap-ripple{position:fixed;z-index:30;width:18px;height:18px;border:1px solid rgba(184,255,233,.88);border-radius:50%;background:radial-gradient(circle,rgba(122,244,212,.62) 0 13%,rgba(47,214,172,.2) 36%,transparent 69%);pointer-events:none;transform:translate(-50%,-50%) scale(.25);animation:tap-ripple .52s cubic-bezier(.18,.72,.25,1) forwards}
@keyframes vision-ambient{from{transform:translate3d(-1%,-1%,0) scale(1)}to{transform:translate3d(1%,1%,0) scale(1.05)}}@keyframes vision-arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes tap-ripple{0%{opacity:.9;transform:translate(-50%,-50%) scale(.25)}100%{opacity:0;transform:translate(-50%,-50%) scale(6)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.panel,body.welcome-view .panel{background:rgba(3,25,19,.94)}}
@media(max-width:430px){.panel,body.welcome-view .panel{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}}
@media(prefers-reduced-motion:reduce){body::after{animation:none}#app>.eyebrow,#app>.h1,#app>.sub,#app>.small,#app>.progress,#app>.opt,#app>.colorgrid,#app>.actions,.welcome-form,.result-intro{animation:none}button,.pill,.opt,.colorchoice,.input,.sources summary,.sources a,.job-list a{transition:none}.tap-ripple{display:none}}

const DATA={"q":[["Problem Solving","حل المشكلات","You face a new problem. What's your first move?","تواجه مشكلة جديدة. وش أول خطوة بتسويها؟",[["Look for information and tools to find a smarter solution.","أبحث عن معلومات وأدوات تساعدني ألقى حلًا أذكى."],["Understand people's experiences and find ways to improve them.","أفهم تجارب الناس وأبحث عن طرق لتحسينها."],["Break the problem into steps and solve it efficiently.","أقسّم المشكلة إلى خطوات وأحلّها بكفاءة."],["Look at the bigger picture and choose a lasting solution.","أنظر للصورة الأكبر وأختار حلًا يدوم أثره."]]],["Real-World Challenge","التحدي الواقعي","Your city is starting a major development project. Which role would you choose?","مدينتك تبدأ مشروع تطوير كبير. أي دور تختارين فيه؟",[["Study the community's needs and design services that improve people's daily lives.","أدرس احتياجات المجتمع وأصمّم خدمات تحسّن حياة الناس اليومية."],["Find investment opportunities and develop a plan to make the project financially successful.","أبحث عن فرص استثمارية وأضع خطة تحقق للمشروع نجاحًا ماليًا."],["Develop smart solutions that make the city's services faster and more accessible.","أطوّر حلولًا ذكية تجعل خدمات المدينة أسرع وأسهل وصولًا للجميع."],["Plan how the project can use resources responsibly and create lasting benefits.","أخطط لاستخدام موارد المشروع بمسؤولية وتحقيق فوائد تستمر على المدى الطويل."]]],["What Drives You?","ما الذي يحفزك?","You've spent months working on a challenging project. Which outcome would make all your hard work feel worthwhile?","قضيتِ أشهرًا تعملين على مشروع صعب. أي نتيجة ستجعلك تشعرين أن كل تعبك كان يستحق؟",[["Seeing something I created bring people together and give them an unforgettable experience.","رؤية شيء صنعته يجمع الناس ويمنحهم تجربة لا تُنسى."],["Discovering a new solution that opens the door to possibilities no one had considered before.","اكتشاف حل جديد يفتح الباب لإمكانيات لم يفكر فيها أحد من قبل."],["Knowing that my work will continue making a positive difference for years to come.","معرفة أن عملي سيستمر في إحداث تأثير إيجابي لسنوات قادمة."],["Turning a complicated idea into something reliable that works effectively in the real world.","تحويل فكرة معقدة إلى شيء موثوق يعمل بفعالية على أرض الواقع."]]],["The Unexpected Opportunity","الفرصة غير المتوقعة","You can join a new team for one month. Which team interests you most?","عندك فرصة تنضمّين لفريق جديد لمدة شهر. أي فريق يثير اهتمامك أكثر؟",[["A team making complex operations run smoothly.","فريق يجعل العمليات المعقدة تسير بسلاسة."],["A team using data to discover solutions that improve people's lives.","فريق يستخدم البيانات لاكتشاف حلول تحسّن حياة الناس."],["A team turning an overlooked place into an exciting destination.","فريق يحوّل مكانًا غير معروف إلى وجهة مميزة."],["A team helping a growing community use its resources wisely.","فريق يساعد مجتمعًا متناميًا على استخدام موارده بحكمة."]]],["The Missing Piece","الجانب المفقود","A project looks successful, but you want to know more. What would you investigate first?","يبدو أن مشروعًا حقق نجاحًا، لكنك تريدين معرفة المزيد. ما أول شيء ستبحثين عنه؟",[["Are the impressive results as good as they seem?","هل النتائج المبهرة جيدة فعلًا كما تبدو؟"],["Has the project truly improved people's lives?","هل حسّن المشروع حياة الناس فعلًا؟"],["Can the project succeed in the long run without hidden costs?","هل يمكن أن يستمر نجاح المشروع دون تكاليف خفية؟"],["Has the project created new opportunities for people to explore and connect?","هل أتاح المشروع فرصًا جديدة للناس للاستكشاف والتواصل؟"]]],["The Unexpected Trade-Off","المفاضلة غير المتوقعة","Your project faces a setback. You can protect only one thing. What matters most to you?","واجه مشروعك مشكلة غير متوقعة، ولا يمكنك الحفاظ إلا على شيء واحد. ما الأهم بالنسبة لك؟",[["The ability to adapt and try new approaches.","القدرة على التكيف وتجربة طرق جديدة."],["The trust and well-being of the people who depend on it.","ثقة الأشخاص الذين يعتمدون عليه وراحتهم."],["The project's financial success in the long run.","نجاح ا
