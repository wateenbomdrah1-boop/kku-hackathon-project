<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover Your Future</title><style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#251d38;background:#f5f2fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#dfd0fb,transparent 40%),#f5f2fb}body.welcome-view{min-height:100dvh;background:linear-gradient(rgba(6,18,17,.72),rgba(6,18,17,.72)),url("vision2030-background.jpeg") center/cover no-repeat;background-color:#071815}body.welcome-view .panel{background:rgba(255,255,255,.96)}body.welcome-view .brand,body.welcome-view .credit,body.welcome-view #foot{color:#fff}.wrap{max-width:760px;margin:auto;padding:24px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:850;font-size:20px;color:#56378e}.pill{border:1px solid #bda6e1;background:#fff;border-radius:40px;padding:9px 16px;color:#54358d;cursor:pointer;font-weight:700}.panel{background:white;border:1px solid #e6dff0;border-radius:25px;box-shadow:0 15px 55px #51317d13;padding:clamp(22px,5vw,42px);margin-top:24px}.eyebrow{color:#805bb4;font-size:13px;font-weight:800;letter-spacing:1px}.h1{font-size:clamp(29px,6vw,42px);margin:12px 0;color:#372455;line-height:1.16}.sub{font-size:17px;line-height:1.75;color:#554c64}.muted{color:#857c93;font-size:13px}.progress{height:7px;border-radius:10px;background:#eae2f4;overflow:hidden;margin:20px 0}.fill{height:100%;background:linear-gradient(90deg,#8056b5,#b28bdc);transition:width .25s}.opt{display:flex;align-items:center;gap:15px;border:1.5px solid #e4deec;background:#fff;border-radius:17px;padding:16px;margin:11px 0;cursor:pointer;text-align:start;width:100%;font:inherit;color:inherit;line-height:1.6;transition:.15s}.opt:hover{border-color:#a581d4;background:#fbf9ff}.opt.selected{border:2px solid #8056b5;background:#f5effd}.letter{flex-shrink:0;width:36px;height:36px;border-radius:50%;background:#eee6f7;color:#62428e;display:grid;place-items:center;font-weight:800}.opt.selected .letter{background:#8056b5;color:white}.btn{background:#7048a7;color:white;border:0;padding:14px 23px;border-radius:13px;font-weight:750;font-size:15px;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#f0eaf7;color:#5d3b89}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.bonus-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.colorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.colorchoice{border:2px solid #e7e1ef;background:white;border-radius:16px;padding:9px;cursor:pointer;font:inherit}.colorchoice.selected{border-color:#8056b5;background:#f5effd}.swatch{height:94px;border-radius:11px;display:grid;place-items:center;color:white;font-size:32px}.colorname{padding:10px 2px 3px;font-weight:750}.result{border-left:5px solid;padding:15px;border-radius:12px;background:#faf8fd;margin:12px 0}.bar{height:8px;background:#eee8f4;border-radius:10px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;border-radius:10px}.pie-layout{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:26px;margin:24px 0}.pie-chart{width:min(100%,300px);height:auto;filter:drop-shadow(0 6px 14px #38235218)}.pie-legend{flex:1;min-width:220px;display:grid;gap:12px}.legend-row{display:flex;align-items:center;gap:10px;font-size:14px}.legend-dot{width:14px;height:14px;flex:none;border-radius:4px}.legend-name{flex:1}.legend-value{font-weight:800;white-space:nowrap}.credit{text-align:center;margin:26px auto 0;color:#76678b;font-size:12px;letter-spacing:.25px}.small{font-size:13px;line-height:1.6;color:#6f647e}.hide{display:none}.welcome-form{display:grid;gap:16px;margin-top:24px}.field{display:grid;gap:8px}.field-label{color:#372455;font-size:15px;font-weight:800}.required{color:#8056b5}.input{width:100%;min-height:48px;border:1.5px solid #e4deec;border-radius:13px;background:#fff;padding:12px 14px;color:#251d38;font:inherit;line-height:1.4;transition:border-color .15s,box-shadow .15s}.input:focus{outline:0;border-color:#8056b5;box-shadow:0 0 0 3px #dfd0fb}.input[aria-invalid=true]{border-color:#b42318}.field-error{min-height:20px;margin:0;color:#9d241c;font-size:13px;font-weight:700;line-height:1.45}.welcome-form .btn{justify-self:start;min-height:48px}.pill:focus-visible,.btn:focus-visible,.opt:focus-visible,.colorchoice:focus-visible{outline:3px solid #8056b5;outline-offset:3px}.input::placeholder{color:#857c93;opacity:1}[dir=rtl] .opt,[dir=rtl] .field{text-align:right}[dir=rtl] .result{border-left:0;border-right:5px solid}@media(max-width:430px){.bonus-controls{width:100%;justify-content:stretch}.bonus-controls .btn{flex:1}.colorgrid{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px 10px 40px}.panel{padding:20px}.welcome-form .btn{width:100%;justify-self:stretch}}@media(prefers-reduced-motion:reduce){.fill,.opt,.input{transition:none}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">✦ Discover Your Future</div><button id="lang" class="pill" onclick="toggleLang()">العربية</button></header><section class="panel" id="app"><h1 class="h1">Discover Your Future ✨</h1><p class="sub">افتحي الملف في Safari أو انشريه على Netlify لتشغيل الاختبار التفاعلي. معاينة الملفات قد تمنع تشغيل JavaScript.</p><p class="sub">Open in Safari or publish to Netlify to run the interactive quiz. File previews may block JavaScript.</p></section><footer class="small" id="foot" style="text-align:center;margin-top:24px"></footer><div class="credit">created by wateen bomdrah</div></main><script>
const DATA={"q":[["Problem Solving","حل المشكلات","You face a new problem. What's your first move?","تواجه مشكلة جديدة. وش أول خطوة بتسويها؟",[["Look for information and tools to find a smarter solution.","أبحث عن معلومات وأدوات تساعدني ألقى حلًا أذكى."],["Understand people's experiences and find ways to improve them.","أفهم تجارب الناس وأبحث عن طرق لتحسينها."],["Break the problem into steps and solve it efficiently.","أقسّم المشكلة إلى خطوات وأحلّها بكفاءة."],["Look at the bigger picture and choose a lasting solution.","أنظر للصورة الأكبر وأختار حلًا يدوم أثره."]]],["Real-World Challenge","التحدي الواقعي","Your city is starting a major development project. Which role would you choose?","مدينتك تبدأ مشروع تطوير كبير. أي دور تختارين فيه؟",[["Study the community's needs and design services that improve people's daily lives.","أدرس احتياجات المجتمع وأصمّم خدمات تحسّن حياة الناس اليومية."],["Find investment opportunities and develop a plan to make the project financially successful.","أبحث عن فرص استثمارية وأضع خطة تحقق للمشروع نجاحًا ماليًا."],["Develop smart solutions that make the city's services faster and more accessible.","أطوّر حلولًا ذكية تجعل خدمات المدينة أسرع وأسهل وصولًا للجميع."],["Plan how the project can use resources responsibly and create lasting benefits.","أخطط لاستخدام موارد المشروع بمسؤولية وتحقيق فوائد تستمر على المدى الطويل."]]],["What Drives You?","ما الذي يحفزك?","You've spent months working on a challenging project. Which outcome would make all your hard work feel worthwhile?","قضيتِ أشهرًا تعملين على مشروع صعب. أي نتيجة ستجعلك تشعرين أن كل تعبك كان يستحق؟",[["Seeing something I created bring people together and give them an unforgettable experience.","رؤية شيء صنعته يجمع الناس ويمنحهم تجربة لا تُنسى."],["Discovering a new solution that opens the door to possibilities no one had considered before.","اكتشاف حل جديد يفتح الباب لإمكانيات لم يفكر فيها أحد من قبل."],["Knowing that my work will continue making a positive difference for years to come.","معرفة أن عملي سيستمر في إحداث تأثير إيجابي لسنوات قادمة."],["Turning a complicated idea into something reliable that works effectively in the real world.","تحويل فكرة معقدة إلى شيء موثوق يعمل بفعالية على أرض الواقع."]]],["The Unexpected Opportunity","الفرصة غير المتوقعة","You can join a new team for one month. Which team interests you most?","عندك فرصة تنضمّين لفريق جديد لمدة شهر. أي فريق يثير اهتمامك أكثر؟",[["A team making complex operations run smoothly.","فريق يجعل العمليات المعقدة تسير بسلاسة."],["A team using data to discover solutions that improve people's lives.","فريق يستخدم البيانات لاكتشاف حلول تحسّن حياة الناس."],["A team turning an overlooked place into an exciting destination.","فريق يحوّل مكانًا غير معروف إلى وجهة مميزة."],["A team helping a growing community use its resources wisely.","فريق يساعد مجتمعًا متناميًا على استخدام موارده بحكمة."]]],["The Missing Piece","الجانب المفقود","A project looks successful, but you want to know more. What would you investigate first?","يبدو أن مشروعًا حقق نجاحًا، لكنك تريدين معرفة المزيد. ما أول شيء ستبحثين عنه؟",[["Are the impressive results as good as they seem?","هل النتائج المبهرة جيدة فعلًا كما تبدو؟"],["Has the project truly improved people's lives?","هل حسّن المشروع حياة الناس فعلًا؟"],["Can the project succeed in the long run without hidden costs?","هل يمكن أن يستمر نجاح المشروع دون تكاليف خفية؟"],["Has the project created new opportunities for people to explore and connect?","هل أتاح المشروع فرصًا جديدة للناس للاستكشاف والتواصل؟"]]],["The Unexpected Trade-Off","المفاضلة غير المتوقعة","Your project faces a setback. You can protect only one thing. What matters most to you?","واجه مشروعك مشكلة غير متوقعة، ولا يمكنك الحفاظ إلا على شيء واحد. ما الأهم بالنسبة لك؟",[["The ability to adapt and try new approaches.","القدرة على التكيف وتجربة طرق جديدة."],["The trust and well-being of the people who depend on it.","ثقة الأشخاص الذين يعتمدون عليه وراحتهم."],["The project's financial success in the long run.","نجاح المشروع ماليًا على المدى الطويل."],["The quality and reliability of the final result.","جودة النتيجة النهائية وموثوقيتها."]]],["The Future Is in Your Hands","المستقبل بين يديك","Imagine you're given access to a futuristic innovation lab for 24 hours. You can create anything, and a team of experts will bring your idea to life. Which creation would you be most excited to see become reality?","تخيّلي أنك حصلتِ على فرصة لدخول مختبر ابتكار مستقبلي لمدة 24 ساعة. يمكنك ابتكار أي شيء، وسيساعدك فريق من الخبراء على تحويل فكرتك إلى واقع. أي ابتكار ستتحمسين لرؤيته يتحقق؟",[["A personalized system that detects health risks early and helps people make better decisions about their well-being.","نظام شخصي يكتشف المخاطر الصحية مبكرًا ويساعد الناس على اتخاذ قرارات أفضل بشأن صحتهم."],["A new business model that turns an overlooked problem into an opportunity for thousands of people.","نموذج أعمال جديد يحوّل مشكلة لم ينتبه لها الآخرون إلى فرصة يستفيد منها آلاف الأشخاص."],["An immersive experience that allows people to explore cultures, stories, and places in ways never possible before.","تجربة تفاعلية غامرة تتيح للناس استكشاف الثقافات والقصص والأماكن بطرق لم تكن ممكنة من قبل."],["A self-sustaining community that produces what it needs while dramatically reducing waste and resource consumption.","مجتمع مكتفٍ ذاتيًا ينتج احتياجاته مع تقليل النفايات واستهلاك الموارد بشكل كبير."]]],["The Moment You Knew","اللحظة التي تأكدتِ فيها","Imagine you're invited to experience your future career for one day. Which moment would make you think, \"This is exactly where I belong\"?","تخيّلي أنك حصلتِ على فرصة لتجربة مهنتك المستقبلية ليوم واحد. أي لحظة ستجعلك تقولين: «هذا مكاني فعلًا»؟",[["Watching an idea you developed become a real solution that changes how things work.","رؤية فكرة طوّرتِها تتحول إلى حل حقيقي يغيّر طريقة عمل الأشياء."],["Seeing how your work directly improves someone's health and quality of life.","رؤية عملك يحسّن بشكل مباشر صحة شخص وجودة حياته."],["Bringing people, resources, and opportunities together to turn an ambitious vision into a successful venture.","الجمع بين الأشخاص والموارد والفرص لتحويل رؤية طموحة إلى مشروع ناجح."],["Seeing a complex system you helped build operate reliably and make everyday life easier.","رؤية نظام معقد ساهمتِ في بنائه يعمل بكفاءة وموثوقية ويجعل الحياة اليومية أسهل."]]],["The Future Museum","متحف المستقبل","It's the year 2050. You're visiting a museum showcasing humanity's greatest breakthroughs of the past 25 years. You have time to explore only one exhibition. Which one would you enter?","نحن في عام 2050. تزورين متحفًا يعرض أعظم إنجازات البشرية خلال آخر 25 سنة. لديك وقت لزيارة معرض واحد فقط. أي معرض ستختارين؟",[["The exhibition revealing how scientists learned to prevent diseases before symptoms even appeared.","المعرض الذي يكشف كيف تعلّم العلماء الوقاية من الأمراض قبل ظهور أعراضها."],["The exhibition showing how entire cities learned to produce, transport, and distribute what they need with almost no waste.","المعرض الذي يوضح كيف أصبحت مدن كاملة تنتج احتياجاتها وتنقلها وتوزعها دون هدر يُذكر."],["The exhibition where you can step inside lost civilizations and experience their stories as if you had lived there.","المعرض الذي يتيح لك دخول حضارات اندثرت وعيش قصصها وكأنك كنتِ جزءًا منها."],["The exhibition documenting how humanity restored damaged ecosystems and brought endangered species back from the brink.","المعرض الذي يوثّق كيف أعادت البشرية إحياء الأنظمة البيئية المتضررة وأنقذت الأنواع المهددة بالانقراض."]]],["Building Tomorrow","نبني الغد","Vision 2030 is creating new possibilities across Saudi Arabia. Which project would you be most excited to help shape?","تفتح رؤية ٢٠٣٠ آفاقًا جديدة في أنحاء المملكة. أي مشروع ستتحمسين أكثر للمساهمة في تطويره؟",[["A digital service that makes everyday life simpler for people and businesses.","خدمة رقمية تجعل الحياة اليومية أسهل للأفراد والأعمال."],["A health initiative that helps communities live healthier lives.","مبادرة صحية تساعد المجتمعات على عيش حياة أكثر صحة."],["A cultural experience that helps visitors discover local stories and places.","تجربة ثقافية تساعد الزوار على اكتشاف القصص والأماكن المحلية."],["A smarter system that improves how resources, energy, and goods move.","نظام ذكي يحسّن إدارة الموارد والطاقة وحركة السلع."]]],["Lead in Your Color","قُد بلونك","If your leadership had a color, which one would it be?","لو كان لقيادتك لون، وش بيكون؟",[["Purple","البنفسجي"],["Gold","الذهبي"],["Turquoise","التركوازي"],["Blue","الأزرق"],["Orange","البرتقالي"],["Green","الأخضر"]]]],"matrix":[[["Tech","Business"],["Tourism","Health"],["Business","Industry"],["Sustainability","Health"]],[["Health","Tourism"],["Business","Industry"],["Tech","Industry"],["Sustainability","Industry"]],[["Tourism","Business"],["Tech","Health"],["Sustainability","Health"],["Industry","Business"]],[["Business","Industry"],["Tech","Health"],["Tourism","Business"],["Sustainability","Industry"]],[["Business","Tech"],["Health","Tourism"],["Sustainability","Industry"],["Tourism","Business"]],[["Tech","Sustainability"],["Health","Tourism"],["Business","Industry"],["Industry","Tech"]],[["Health","Tech"],["Business","Sustainability"],["Tourism","Tech"],["Sustainability","Industry"]],[["Tech","Industry"],["Health","Tech"],["Business","Tourism"],["Industry","Sustainability"]],[["Health","Tech"],["Industry","Sustainability"],["Tourism","Tech"],["Sustainability","Health"]],[["Tech","Business"],["Health","Sustainability"],["Tourism","Business"],["Industry","Sustainability"]]],"sectors":{"Tech":["Technology & Digital Innovation","التقنية والابتكار الرقمي","#8555B8"],"Business":["Business, Finance & Entrepreneurship","الأعمال والمالية وريادة الأعمال","#C68A25"],"Health":["Healthcare & Biotechnology","الرعاية الصحية والتقنية الحيوية","#3DABAD"],"Tourism":["Tourism, Culture & Entertainment","السياحة والثقافة والترفيه","#3265B5"],"Industry":["Industry, Energy & Logistics","الصناعة والطاقة والخدمات اللوجستية","#D86C38"],"Sustainability":["Sustainability & Environment","الاستدامة والبيئة","#4C9465"]},"colors":["Tech","Business","Health","Tourism","Industry","Sustainability"]};
const scoredQuestionCount=DATA.matrix.length;
const colourQuestionIndex=scoredQuestionCount;
const totalQuestionCount=DATA.q.length;
let lang='en',step=-1,answers=Array(totalQuestionCount).fill(null),participant={name:'',age:''};
const $=x=>document.getElementById(x);
const L=(en,ar)=>lang==='en'?en:ar;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updateParticipant(input){participant[input.name]=input.value}
function startQuiz(event){event.preventDefault();const form=event.currentTarget,name=form.elements.name,age=form.elements.age;participant={name:name.value.trim(),age:age.value.trim()};const nameError=participant.name?'':L('Enter your full name to continue.','أدخلي اسمك الكامل للمتابعة.');const validAge=/^\d+$/.test(participant.age)&&Number(participant.age)>=1&&Number(participant.age)<=120;const ageError=validAge?'':L('Enter a whole-number age from 1 to 120.','أدخلي عمرًا صحيحًا من ١ إلى ١٢٠.');$('name-error').textContent=nameError;$('age-error').textContent=ageError;name.setAttribute('aria-invalid',String(Boolean(nameError)));age.setAttribute('aria-invalid',String(Boolean(ageError)));if(nameError||ageError){(nameError?name:age).focus();return}step=0;render()}
function restartQuiz(){answers=Array(totalQuestionCount).fill(null);participant={name:'',age:''};step=-1;render()}
function toggleLang(){lang=lang==='en'?'ar':'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='en'?'العربية':'English';render()}
function render(){
 document.body.classList.toggle('welcome-view',step===-1);
 $('foot').textContent=L('An exploratory experience, not a validated career assessment. The optional leadership colour does not affect sector scores.','تجربة استكشافية وليست اختبارًا مهنيًا معتمدًا. لون القيادة الاختياري لا يؤثر في نقاط القطاعات.');
 if(step===-1){$('app').innerHTML=`<div class="eyebrow">${L('DISCOVER YOUR FUTURE','اكتشفي مستقبلك')}</div><h1 class="h1">${L('Your future starts with curiosity.','مستقبلك يبدأ بفضولك.')}</h1><p class="sub">${L('Tell us a little about yourself, then explore the fields that spark your interest.','أخبرينا قليلًا عنك، ثم اكتشفي المجالات التي تثير اهتمامك.')}</p><p class="small">${L('10 scored questions · Optional creative bonus · Arabic & English · Instant results','١٠ أسئلة مقيّمة · إضافة إبداعية اختيارية · عربي وإنجليزي · نتائج فورية')}</p><form class="welcome-form" onsubmit="startQuiz(event)" novalidate><div class="field"><label class="field-label" for="name">${L('Full Name','الاسم الكامل')} <span class="required" aria-hidden="true">*</span></label><input class="input" id="name" name="name" type="text" value="${esc(participant.name)}" oninput="updateParticipant(this)" autocomplete="name" required aria-describedby="name-error" placeholder="${L('Enter your full name','أدخلي اسمك الكامل')}"><p class="field-error" id="name-error" role="alert"></p></div><div class="field"><label class="field-label" for="age">${L('Age','العمر')} <span class="required" aria-hidden="true">*</span></label><input class="input" id="age" name="age" type="number" value="${esc(participant.age)}" oninput="updateParticipant(this)" min="1" max="120" step="1" inputmode="numeric" autocomplete="off" required aria-describedby="age-error" placeholder="${L('Enter your age','أدخلي عمرك')}"><p class="field-error" id="age-error" role="alert"></p></div><button class="btn" type="submit">${L('Start Quiz →','ابدأ الاختبار ←')}</button></form>`;return}
 if(step===totalQuestionCount){results();return}
 const q=DATA.q[step],isColourBonus=step===colourQuestionIndex;
 const opts=q[4].map((o,i)=>isColourBonus?`<button class="colorchoice ${answers[step]===i?'selected':''}" onclick="choose(${i})" aria-pressed="${answers[step]===i}"><div class="swatch" style="background:${DATA.sectors[DATA.colors[i]][2]}">${answers[step]===i?'✓':''}</div><div class="colorname">${esc(o[lang==='en'?0:1])}</div></button>`:`<button class="opt ${answers[step]===i?'selected':''}" onclick="choose(${i})" aria-pressed="${answers[step]===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o[lang==='en'?0:1])}</span></button>`).join('');
 const heading=isColourBonus?L('CREATIVE BONUS','إضافة إبداعية'):L('QUESTION','السؤال')+' '+(step+1)+' / '+scoredQuestionCount;
 const progress=isColourBonus?100:(step+1)/totalQuestionCount*100;
 const controls=isColourBonus?`<div class="actions"><button class="btn secondary" onclick="step--;render()">${L('← Back','السابق →')}</button><div class="bonus-controls"><button class="btn secondary" onclick="step=totalQuestionCount;render()">${L('Skip bonus','تخطي الإضافة')}</button><button class="btn" id="next" ${answers[step]===null?'disabled':''} onclick="step++;render()">${L('See my results','عرض نتائجي')}</button></div></div>`:`<div class="actions"><button class="btn secondary" onclick="step--;render()">${L('← Back','السابق →')}</button><button class="btn" id="next" ${answers[step]===null?'disabled':''} onclick="step++;render()">${L('Next →','التالي ←')}</button></div>`;
 $('app').innerHTML=`<div class="eyebrow">${heading}</div><div class="progress"><div class="fill" style="width:${progress}%"></div></div><h1 class="h1">${esc(q[lang==='en'?0:1])}</h1><p class="sub">${esc(q[lang==='en'?2:3])}</p>${isColourBonus?`<p class="small">${L('Optional: choose a colour that feels like your leadership style. It will not change your sector result.','اختياري: اختاري لونًا يشبه أسلوب قيادتك. لن يغيّر نتيجتك في القطاعات.')}</p><div class="colorgrid">${opts}</div>`:opts}${controls}`;
}
function choose(i){answers[step]=i;render()}
function results(){
 const scores=Object.fromEntries(Object.keys(DATA.sectors).map(k=>[k,0]));const primary=Object.fromEntries(Object.keys(DATA.sectors).map(k=>[k,0]));
 for(let i=0;i<scoredQuestionCount;i++){const [p,s]=DATA.matrix[i][answers[i]];scores[p]+=2;scores[s]+=1;primary[p]++}
 const ordered=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||primary[b]-primary[a]);const best=ordered.filter(k=>scores[k]===scores[ordered[0]]&&primary[k]===primary[ordered[0]]);const maximumPoints=scoredQuestionCount*3;
 let angle=-Math.PI/2,paths=[];for(const k of ordered){const portion=scores[k]/maximumPoints,next=angle+portion*2*Math.PI;if(portion>0){const x1=150+116*Math.cos(angle),y1=150+116*Math.sin(angle),x2=150+116*Math.cos(next),y2=150+116*Math.sin(next),large=portion>.5?1:0;paths.push(`<path d="M 150 150 L ${x1.toFixed(5)} ${y1.toFixed(5)} A 116 116 0 ${large} 1 ${x2.toFixed(5)} ${y2.toFixed(5)} Z" fill="${DATA.sectors[k][2]}" stroke="white" stroke-width="2"><title>${esc(DATA.sectors[k][lang==='en'?0:1])}: ${(portion*100).toFixed(1)}%</title></path>`)}angle=next}
 const pie=`<div class="pie-layout"><svg class="pie-chart" viewBox="0 0 300 300" role="img" aria-label="${L('Pie chart of interest distribution across six sectors','رسم دائري لتوزيع الاهتمامات على القطاعات الستة')}">${paths.join('')}</svg><div class="pie-legend">${ordered.map(k=>{const s=DATA.sectors[k];return `<div class="legend-row"><span class="legend-dot" style="background:${s[2]}"></span><span class="legend-name">${esc(s[lang==='en'?0:1])}</span><span class="legend-value">${(scores[k]/maximumPoints*100).toFixed(1)}%</span></div>`}).join('')}</div></div>`;
 const colourChoice=answers[colourQuestionIndex];const colourCard=colourChoice===null?'':(()=>{const colour=DATA.colors[colourChoice],c=DATA.sectors[colour];return `<div class="result" style="border-color:${c[2]}"><div class="eyebrow">${L('YOUR LEADERSHIP COLOR','لون قيادتك')}</div><div style="display:flex;align-items:center;gap:12px;margin:12px 0"><div style="width:48px;height:48px;background:${c[2]};border-radius:50%"></div><b>${esc(DATA.q[colourQuestionIndex][4][colourChoice][lang==='en'?0:1])}</b></div><div class="small">${L('Symbolically linked to: ','مرتبط رمزيًا بقطاع: ')}${esc(c[lang==='en'?0:1])}</div></div>`})();
 $('app').innerHTML=`<div class="eyebrow">${L('YOUR DISCOVERY','نتيجتك')}</div><h1 class="h1">${L('Explore your future','اكتشف مستقبلك')}</h1><p class="sub">${L(best.length>1?'Your top interests are:':'Your strongest interest in this quiz: ',best.length>1?'المجالات الأعلى بالتساوي:':'المجال الأعلى في هذا الاختبار:')} <b>${best.map(k=>esc(DATA.sectors[k][lang==='en'?0:1])).join(' + ')}</b></p><p class="small">${L('How your interests are distributed across six sectors (total: 100%)','توزيع اهتماماتك على القطاعات الستة (المجموع: ١٠٠٪)')}</p>${pie}${colourCard}<p class="small">${L('Percentages show each sector’s share of the '+maximumPoints+' total points across questions 1–'+scoredQuestionCount+'; all six add up to 100%. They are not probabilities or measures of career suitability. Your optional colour is shown separately.','تمثل النسب حصة كل قطاع من إجمالي '+maximumPoints+' نقطة موزعة عبر الأسئلة ١–'+scoredQuestionCount+'، ومجموع القطاعات الستة ١٠٠٪. ليست النسب احتمالات أو مقياسًا للملاءمة المهنية، ويظهر لون القيادة الاختياري منفصلًا.')}</p><div class="actions"><button class="btn secondary" onclick="step=colourQuestionIndex;render()">${L('← Edit creative bonus','تعديل الإضافة الإبداعية →')}</button><button class="btn" onclick="restartQuiz()">${L('Take quiz again','إعادة الاختبار')}</button></div>`;
}
render();
</script></body></html>
