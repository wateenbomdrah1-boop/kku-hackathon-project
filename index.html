);border-radius:50% 50% 43% 43%;background:#fff}.sector-character span{position:absolute;width:24px;height:24px;top:13px;left:20px;border-radius:50%;background:var(--sector)}.sector-character i{position:absolute;width:38px;height:24px;bottom:8px;left:13px;border-radius:20px 20px 8px 8px;background:var(--sector);opacity:.75}.sector-character b{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:20px;left:26px}.character-tech{transform:rotate(-4deg)}.character-business{border-radius:12px}.character-health{border-color:#3DABAD}.character-tourism{border-radius:50% 50% 50% 10%}.character-industry{border-radius:8px}.character-sustainability{border-radius:50% 10% 50% 10%}.score-line,.all-score-row>div:first-child{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-top:18px;font-size:13px;color:#554c64}.score-line strong,.all-score-row strong{color:#372455;white-space:nowrap}.job-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}.job-list li{border-top:1px solid #eee8f4;padding-top:9px}.job-list a,.sources a{color:#56378e;font-weight:800;overflow-wrap:anywhere}.job-list span{display:block;font-size:12px;color:#6f647e;margin-top:3px}.score-chart{margin:28px 0;border:1px solid #e6dff0;background:#faf8fd;border-radius:17px;padding:18px}.score-chart h2{font-size:18px;margin:0 0 6px;color:#372455}.all-score-row{margin-top:13px}.all-score-row .bar{margin-top:6px}.sources{border:1px solid #e6dff0;border-radius:15px;padding:14px 16px;background:#fff;margin:20px 0}.sources summary{cursor:pointer;color:#372455;font-weight:850}.sources ul{padding-inline-start:20px;display:grid;gap:10px;font-size:13px;line-height:1.5;color:#554c64}.sources em{color:#9d241c;font-style:normal;font-weight:700}.colour-row{display:flex;align-items:center;gap:12px;margin:12px 0}.colour-dot{width:48px;height:48px;border-radius:50%}.result-actions{flex-wrap:wrap;justify-content:flex-end}.result-note{text-align:center;margin:22px 0 0}.sources summary:focus-visible,.sources a:focus-visible{outline:3px solid #8056b5;outline-offset:3px}@media(max-width:600px){.match-grid{grid-template-columns:1fr}.result-actions .btn{flex:1}.sector-character{width:60px;height:60px}.sector-character span{top:10px;left:17px}.sector-character i{left:10px;bottom:6px}}[dir=rtl] .sector-character{float:left;margin:0 12px 8px 0}@media(prefers-reduced-motion:reduce){.fill,.opt,.input{transition:none}}

const DATA={"q":[["Problem Solving","حل المشكلات","You face a new problem. What's your first move?","تواجه مشكلة جديدة. وش أول خطوة بتسويها؟",[["Look for information and tools to find a smarter solution.","أبحث عن معلومات وأدوات تساعدني ألقى حلًا أذكى."],["Understand people's experiences and find ways to improve them.","أفهم تجارب الناس وأبحث عن طرق لتحسينها."],["Break the problem into steps and solve it efficiently.","أقسّم المشكلة إلى خطوات وأحلّها بكفاءة."],["Look at the bigger picture and choose a lasting solution.","أنظر للصورة الأكبر وأختار حلًا يدوم أثره."]]],["Real-World Challenge","التحدي الواقعي","Your city is starting a major development project. Which role would you choose?","مدينتك تبدأ مشروع تطوير كبير. أي دور تختارين فيه؟",[["Study the community's needs and design services that improve people's daily lives.","أدرس احتياجات المجتمع وأصمّم خدمات تحسّن حياة الناس اليومية."],["Find investment opportunities and develop a plan to make the project financially successful.","أبحث عن فرص استثمارية وأضع خطة تحقق للمشروع نجاحًا ماليًا."],["Develop smart solutions that make the city's services faster and more accessible.","أطوّر حلولًا ذكية تجعل خدمات المدينة أسرع وأسهل وصولًا للجميع."],["Plan how the project can use resources responsibly and create lasting benefits.","أخطط لاستخدام موارد المشروع بمسؤولية وتحقيق فوائد تستمر على المدى الطويل."]]],["What Drives You?","ما الذي يحفزك?","You've spent months working on a challenging project. Which outcome would make all your hard work feel worthwhile?","قضيتِ أشهرًا تعملين على مشروع صعب. أي نتيجة ستجعلك تشعرين أن كل تعبك كان يستحق؟",[["Seeing something I created bring people together and give them an unforgettable experience.","رؤية شيء صنعته يجمع الناس ويمنحهم تجربة لا تُنسى."],["Discovering a new solution that opens the door to possibilities no one had considered before.","اكتشاف حل جديد يفتح الباب لإمكانيات لم يفكر فيها أحد من قبل."],["Knowing that my work will continue making a positive difference for years to come.","معرفة أن عملي سيستمر في إحداث تأثير إيجابي لسنوات قادمة."],["Turning a complicated idea into something reliable that works effectively in the real world.","تحويل فكرة معقدة إلى شيء موثوق يعمل بفعالية على أرض الواقع."]]],["The Unexpected Opportunity","الفرصة غير المتوقعة","You can join a new team for one month. Which team interests you most?","عندك فرصة تنضمّين لفريق جديد لمدة شهر. أي فريق يثير اهتمامك أكثر؟",[["A team making complex operations run smoothly.","فريق يجعل العمليات المعقدة تسير بسلاسة."],["A team using data to discover solutions that improve people's lives.","فريق يستخدم البيانات لاكتشاف حلول تحسّن حياة الناس."],["A team turning an overlooked place into an exciting destination.","فريق يحوّل مكانًا غير معروف إلى وجهة مميزة."],["A team helping a growing community use its resources wisely.","فريق يساعد مجتمعًا متناميًا على استخدام موارده بحكمة."]]],["The Missing Piece","الجانب المفقود","A project looks successful, but you want to know more. What would you investigate first?","يبدو أن مشروعًا حقق نجاحًا، لكنك تريدين معرفة المزيد. ما أول شيء ستبحثين عنه؟",[["Are the impressive results as good as they seem?","هل النتائج المبهرة جيدة فعلًا كما تبدو؟"],["Has the project truly improved people's lives?","هل حسّن المشروع حياة الناس فعلًا؟"],["Can the project succeed in the long run without hidden costs?","هل يمكن أن يستمر نجاح المشروع دون تكاليف خفية؟"],["Has the project created new opportunities for people to explore and connect?","هل أتاح المشروع فرصًا جديدة للناس للاستكشاف والتواصل؟"]]],["The Unexpected Trade-Off","المفاضلة غير المتوقعة","Your project faces a setback. You can protect only one thing. What matters most to you?","واجه مشروعك مشكلة غير متوقعة، ولا يمكنك الحفاظ إلا على شيء واحد. ما الأهم بالنسبة لك؟",[["The ability to adapt and try new approaches.","القدرة على التكيف وتجربة طرق جديدة."],["The trust and well-being of the people who depend on it.","ثقة الأشخاص الذين يعتمدون عليه وراحتهم."],["The project's financial success in the long run.","نجاح المشروع ماليًا على المدى الطويل."],["The quality and reliability of the final result.","جودة النتيجة النهائية وموثوقيتها."]]],["The Future Is in Your Hands","المستقبل بين يديك","Imagine you're given access to a futuristic innovation lab for 24 hours. You can create anything, and a team of experts will bring your idea to life. Which creation would you be most excited to see become reality?","تخيّلي أنك حصلتِ على فرصة لدخول مختبر ابتكار مستقبلي لمدة 24 ساعة. يمكنك ابتكار أي شيء، وسيساعدك فريق من الخبراء على تحويل فكرتك إلى واقع. أي ابتكار ستتحمسين لرؤيته يتحقق؟",[["A personalized system that detects health risks early and helps people make better decisions about their well-being.","نظام شخصي يكتشف المخاطر الصحية مبكرًا ويساعد الناس على اتخاذ قرارات أفضل بشأن صحتهم."],["A new business model that turns an overlooked problem into an opportunity for thousands of people.","نموذج أعمال جديد يحوّل مشكلة لم ينتبه لها الآخرون إلى فرصة يستفيد منها آلاف الأشخاص."],["An immersive experience that allows people to explore cultures, stories, and places in ways never possible before.","تجربة تفاعلية غامرة تتيح للناس استكشاف الثقافات والقصص والأماكن بطرق لم تكن ممكنة من قبل."],["A self-sustaining community that produces what it needs while dramatically reducing waste and resource consumption.","مجتمع مكتفٍ ذاتيًا ينتج احتياجاته مع تقليل النفايات واستهلاك الموارد بشكل كبير."]]],["The Moment You Knew","اللحظة التي تأكدتِ فيها","Imagine you're invited to experience your future career for one day. Which moment would make you think, \"This is exactly where I belong\"?","تخيّلي أنك حصلتِ على فرصة لتجربة مهنتك المستقبلية ليوم واحد. أي لحظة ستجعلك تقولين: «هذا مكاني فعلًا»؟",[["Watching an idea you developed become a real solution that changes how things work.","رؤية فكرة طوّرتِها تتحول إلى حل حقيقي يغيّر طريقة عمل الأشياء."],["Seeing how your work directly improves someone's health and quality of life.","رؤية عملك يحسّن بشكل مباشر صحة شخص وجودة حياته."],["Bringing people, resources, and opportunities together to turn an ambitious vision into a successful venture.","الجمع بين الأشخاص والموارد والفرص لتحويل رؤية طموحة إلى مشروع ناجح."],["Seeing a complex system you helped build operate reliably and make everyday life easier.","رؤية نظام معقد ساهمتِ في بنائه يعمل بكفاءة وموثوقية ويجعل الحياة اليومية أسهل."]]],["The Future Museum","متحف المستقبل","It's the year 2050. You're visiting a museum showcasing humanity's greatest breakthroughs of the past 25 years. You have time to explore only one exhibition. Which one would you enter?","نحن في عام 2050. تزورين متحفًا يعرض أعظم إنجازات البشرية خلال آخر 25 سنة. لديك وقت لزيارة معرض واحد فقط. أي معرض ستختارين؟",[["The exhibition revealing how scientists learned to prevent diseases before symptoms even appeared.","المعرض الذي يكشف كيف تعلّم العلماء الوقاية من الأمراض قبل ظهور أعراضها."],["The exhibition showing how entire cities learned to produce, transport, and distribute what they need with almost no waste.","المعرض الذي يوضح كيف أصبحت مدن كاملة تنتج احتياجاتها وتنقلها وتوزعها دون هدر يُذكر."],["The exhibition where you can step inside lost civilizations and experience their stories as if you had lived there.","المعرض الذي يتيح لك دخول حضارات اندثرت وعيش قصصها وكأنك كنتِ جزءًا منها."],["The exhibition documenting how humanity restored damaged ecosystems and brought endangered species back from the brink.","المعرض الذي يوثّق كيف أعادت البشرية إحياء الأنظمة البيئية المتضررة وأنقذت الأنواع المهددة بالانقراض."]]],["Building Tomorrow","نبني الغد","Vision 2030 is creating new possibilities across Saudi Arabia. Which project would you be most excited to help shape?","تفتح رؤية ٢٠٣٠ آفاقًا جديدة في أنحاء المملكة. أي مشروع ستتحمسين أكثر للمساهمة في تطويره؟",[["A digital service that makes everyday life simpler for people and businesses.","خدمة رقمية تجعل الحياة اليومية أسهل للأفراد والأعمال."],["A health initiative that helps communities live healthier lives.","مبادرة صحية تساعد المجتمعات على عيش حياة أكثر صحة."],["A cultural experience that helps visitors discover local stories and places.","تجربة ثقافية تساعد الزوار على اكتشاف القصص والأماكن المحلية."],["A smarter system that improves how resources, energy, and goods move.","نظام ذكي يحسّن إدارة الموارد والطاقة وحركة السلع."]]],["Lead in Your Color","قُد بلونك","If your leadership had a color, which one would it be?","لو كان لقيادتك لون، وش بيكون؟",[["Purple","البنفسجي"],["Gold","الذهبي"],["Turquoise","التركوازي"],["Blue","الأزرق"],["Orange","البرتقالي"],["Green","الأخضر"]]]],"matrix":[[["Tech","Business"],["Tourism","Health"],["Business","Industry"],["Sustainability","Health"]],[["Health","Tourism"],["Business","Industry"],["Tech","Industry"],["Sustainability","Industry"]],[["Tourism","Business"],["Tech","Health"],["Sustainability","Health"],["Industry","Business"]],[["Business","Industry"],["Tech","Health"],["Tourism","Business"],["Sustainability","Industry"]],[["Business","Tech"],["Health","Tourism"],["Sustainability","Industry"],["Tourism","Business"]],[["Tech","Sustainability"],["Health","Tourism"],["Business","Industry"],["Industry","Tech"]],[["Health","Tech"],["Business","Sustainability"],["Tourism","Tech"],["Sustainability","Industry"]],[["Tech","Industry"],["Health","Tech"],["Business","Tourism"],["Industry","Sustainability"]],[["Health","Tech"],["Industry","Sustainability"],["Tourism","Tech"],["Sustainability","Health"]],[["Tech","Business"],["Health","Sustainability"],["Tourism","Business"],["Industry","Sustainability"]]],"sectors":{"Tech":["Technology & Digital Innovation","التقنية والابتكار الرقمي","#8555B8"],"Business":["Business, Finance & Entrepreneurship","الأعمال والمالية وريادة الأعمال","#C68A25"],"Health":["Healthcare & Biotechnology","الرعاية الصحية والتقنية الحيوية","#3DABAD"],"Tourism":["Tourism, Culture & Entertainment","السياحة والثقافة والترفيه","#3265B5"],"Industry":["Industry, Energy & Logistics","الصناعة والطاقة والخدمات اللوجستية","#D86C38"],"Sustainability":["Sustainability & Environment","الاستدامة و function startQuiz(event){event.preventDefault();const form=event.currentTarget,name=form.elements.name,age=form.elements.age;participant={name:name.value.trim(),age:age.value.trim()};const nameError=participant.name?'':L('Enter your full name to continue.','أدخلي اسمك الكامل للمتابعة.');const validAge=/^\d+$/.test(participant.age)&&Number(participant.age)>=1&&Number(participant.age)<=120;const ageError=validAge?'':L('Enter a whole-number age from 1 to 120.','أدخلي عمرًا صحيحًا من ١ إلى ١٢٠.');$('name-error').textContent=nameError;$('age-error').textContent=ageError;name.setAttribute('aria-invalid',String(Boolean(nameError)));age.setAttribute('aria-invalid',String(Boolean(ageError)));if(nameError||ageError){(nameError?name:age).focus();return}resultStage='intro';step=0;render()}

function calculateResults(){const scores=Object.fromEntries(Object.keys(DATA.sectors).map(k=>[k,0]));const primary=Object.fromEntries(Object.keys(DATA.sectors).map(k=>[k,0]));for(let i=0;i<scoredQuestionCount;i++){const [p,s]=DATA.matrix[i][answers[i]];scores[p]+=2;scores[s]+=1;primary[p]++}const ordered=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||primary[b]-primary[a]);return {scores,primary,ordered,maximum:scoredQuestionCount*3}}

etail'?renderResults():renderResultIntro();return}const q=DATA.q[step],isColourBonus=step===colourQuestionIndex;const opts=q[4].map((o,i)=>isColourBonus?`<button class="colorchoice ${answers[step]===i?'selected':''}" onclick="choose(${i})" aria-pressed="${answers[step]===i}"><div class="swatch" style="background:${DATA.sectors[DATA.colors[i]][2]}">${answers[step]===i?'✓':''}</div><div class="colorname">${esc(o[lang==='en'?0:1])}</div></button>`:`<button class="opt ${answers[step]===i?'selected':''}" onclick="choose(${i})" aria-pressed="${answers[step]===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o[lang==='en'?0:1])}</span></button>`).join('');const heading=isColourBonus?L('CREATIVE BONUS','إضافة إبداعية'):L('QUESTION','السؤال')+' '+(step+1)+' / '+scoredQuestionCount;const progress=isColourBonus?100:(step+1)/totalQuestionCount*100;const controls=isColourBonus?`<div class="actions"><button class="btn secondary" onclick="step--;render()">${L('← Back','السابق →')}</button><div class="bonus-controls"><button class="btn secondary" onclick="resultStage='intro';step=totalQuestionCount;render()">${L('Skip bonus','تخطي الإضافة')}</button><button class="btn" id="next" ${answers[step]===null?'disabled':''} onclick="resultStage='intro';step++;render()">${L('See my results','عرض نتائجي')}</button></div></div>`:`<div class="actions"><button class="btn secondary" onclick="step--;render()">${L('← Back','السابق →')}</button><button class="btn" id="next" ${answers[step]===null?'disabled':''} onclick="step++;render()">${L('Next →','التالي ←')}</button></div>`;$('app').innerHTML=`<div class="eyebrow">${heading}</div><div class="progress"><div class="fill" style="width:${progress}%"></div></div><h1 class="h1">${esc(q[lang==='en'?0:1])}</h1><p class="sub">${esc(q[lang==='en'?2:3])}</p>${isColourBonus?`<p class="small">${L('Optional: choose a colour that feels like your leadership style. It will not change your sector result.','اختياري: اختاري لونًا يشبه أسلوب قيادتك. لن يغيّر function choose(i){answers[step]=i;render()}
function renderResultIntro(){const r=calculateResults(),top=DATA.sectors[r.ordered[0]];$('app').innerHTML=`<div class="result-intro"><div class="eyebrow">${L('YOUR DISCOVERY IS READY','نتيجتك جاهزة')}</div><h1 class="h1">${L('Your sector matches are ready,','تطابقات قطاعاتك جاهزة،')} ${esc(participant.name||L('future explorer','يا مستكشفة المستقبل'))}.</h1><p class="sub">${L('Your strongest match is waiting to be revealed.','تطابقك الأقوى بانتظار أن تكتشفيه.')}</p><div class="intro-orb" style="--sector:${top[2]}" aria-hidden="true"></div><button class="btn result-cta" onclick="viewSectorMatches()">${L('View Your Sector Matches →','اعرضي تطابقات قطاعاتك ←')}</button></div>`}

function matchCard(sector,rank,r){const meta=DATA.meta[sector],record=DATA.sectors[sector],percentage=(r.scores[sector]/r.maximum*100).toFixed(1);return `<article class="match-card ${rank===1?'primary-match':'second-match'}" style="--sector:${record[2]}"><div class="rank-badge">${rank===1?L('#1 MAIN MATCH','المطابقة الأولى'):L('#2 SECOND MATCH','المطابقة الثانية')}</div>${character(meta.character)}<div class="match-content"><div class="eyebrow">${rank===1?L('TOP SECTOR','القطاع الأعلى'):L('RUNNER-UP','القطاع التالي')}</div><h2>${esc(record[lang==='en'?0:1])}</h2><p>${esc(meta.desc[lang==='en'?0:1])}</p><div class="score-line"><span>${L('Match score','درجة التطابق')}</span><strong>${r.scores[sector]} / ${r.maximum} · ${percentage}%</strong></div><div class="bar" role="img" aria-label="${esc(record[lang==='en'?0:1])}: ${r.scores[sector]} of ${r.maximum}"><span style="width:${percentage}%;background:var(--sector)"></span></div><h3>${L('Example jobs','أمثلة وظائف')}</h3>${jobMarkup(sector)}</div></article>`}
function sourceMarkup(){return Object.keys(DATA.jobs).map(sector=>DATA.jobs[sector].map(j=>`<li><strong>${esc(DATA.sectors[sector][lang==='en'?0:1])}:</strong> <a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">${esc(j.title[lang==='en'?0:1])} — ${esc(j.issuer[lang==='en'?0:1])}</a>${j.historical?` <em>${L('(historical or expired example; not a current opening)','(مثال تاريخي أو إعلان منتهٍ؛ ليس فرصة عمل حالية)')}</em>`:''}</li>`).join('')).join('')}
function renderResults(){const r=calculateResults(),first=r.ordered[0],second=r.ordered[1],colourChoice=answers[colourQuestionIndex],colourCard=colourChoice===null?'':(()=>{const colour=DATA.colors[colourChoice],c=DATA.sectors[colour];return `<div class="result color-result" style="border-color:${c[2]}"><div class="eyebrow">${L('YOUR LEADERSHIP COLOR','لون قيادتك')}</div><div class="colour-row"><div class="colour-dot" style="background:${c[2]}"></div><b>${esc(DATA.q[colourQuestionIndex][4][colourChoice][lang==='en'?0:1])}</b></div><div class="small">${L('A creative bonus, shown separately from sector scores.','إضافة إبداعية تظهر منفصلة عن نقاط القطاعات.')}</div></div>`})();const scoreBars=r.ordered.map(k=>{const sector=DATA.sectors[k],pct=(r.scores[k]/r.maximum*100).toFixed(1);return `<div class="all-score-row"><div><span>${esc(sector[lang==='en'?0:1])}</span><strong>${r.scores[k]}/${r.maximum} · ${pct}%</strong></div><div class="bar"><span style="width:${pct}%;background:${sector[2]}"></span></div></div>`}).join('');$('app').innerHTML=`<section id="result-card"><div class="eyebrow">${L('YOUR SECTOR MATCHES','تطابقات قطاعاتك')}</div><h1 class="h1">${L('Your future, in two directions','مستقبلك في اتجاهين')}</h1><p class="sub">${L('These are your highest matches from the 10 scored questions.','هذه أعلى تطابقاتك من الأسئلة العشرة المقيّمة.')}</p><div class="match-grid">${matchCard(first,1,r)}${matchCard(second,2,r)}</div><section class="score-chart" aria-labelledby="score-heading"><h2 id="score-heading">${L('All sector scores','نقاط جميع القطاعات')}</h2>${scoreBars}</section>${colourCard}<details class="sources"><summary>${L('Sources: official Saudi references for example jobs','المصادر: مراجع سعودية رسمية لأمثلة الوظائف')}</summary><p class="small">${L('Links open official Saudi government or Vision 2030 ecosystem sources. Historical and expired announcements are labelled and are not current vacancies.','تفتح الروابط مصادر رسمية حكومية سعودية أو من منظومة رؤية ٢٠٣٠. وتُعلَّم الإعلانات التاريخية والمنتهية ولا تمثل فرصًا حالية.')}</p><ul>${sourceMarkup()}</ul></details><div class="actions result-actions"><button class="btn secondary" onclick="step=colourQuestionIndex;resultStage='intro';render()">${L('← Edit creative bonus','تعديل الإضافة الإبداعية →')}</button><button class="btn" onclick="downloadResult()">${L('Save My Result','حفظ نتيجتي')}</button><button class="btn secondary" onclick="restartQuiz()">${L('Take quiz again','إعادة الاختبار')}</button></div><p class="small result-note">${L('Scores are exploratory interest signals, not career suitability measurements.','الدرجات مؤشرات استكشافية للاهتمام وليست قياسًا للملاءمة المهنية.')}</p></section>`}
function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight,align){ctx.textAlign=align;const words=String(text).split(' ');let line='',lines=[];for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else{line=test}}if(line)lines.push(line);lines.forEach((item,i)=>ctx.fillText(item,x,y+i*lineHeight));return y+lines.length*lineHeight}
function downloadResult(){const r=calculateResults(),first=r.ordered[0],second=r.ordered[1],canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),w=1200,h=1500,rtl=lang==='ar',left=rtl?w-90:90,right=rtl?90:w-90;canvas.width=w;canvas.height=h;ctx.fillStyle='#f5f2fb';ctx.fillRect(0,0,w,h);ctx.fillStyle='#372455';ctx.font='700 48px system-ui';ctx.textAlign=rtl?'right':'left';ctx.fillText(L('Discover Your Future','اكتشفي مستقبلك'),left,85);ctx.fillStyle='#8056b5';ctx.font='700 24px system-ui';ctx.fillText(L('Your two sector matches','تطابقا القطاعين الأعلى'),left,125);let y=185;[first,second].forEach((sector,index)=>{const s=DATA.sectors[sector],meta=DATA.meta[sector],pct=(r.scores[sector]/r.maximum*100).toFixed(1),cardX=65,cardW=w-130;ctx.fillStyle='#fff';ctx.strokeStyle=s[2];ctx.lineWidth=7;ctx.beginPath();ctx.roundRect(cardX,y,cardW,390,28);ctx.fill();ctx.stroke();ctx.fillStyle=s[2];ctx.beginPath();ctx.arc(rtl?w-145:145,y+82,42,0,Math.PI*2);ctx.fill();ctx.fillStyle='#372455';ctx.font='700 26px system-ui';ctx.textAlign=rtl?'right':'left';ctx.fillText(index===0?L('#1 MAIN MATCH','المطابقة الأولى') : L('#2 SECOND MATCH','المطابقة الثانية'),left,y+65);ctx.font='700 36px system-ui';ctx.fillText(s[rtl?1:0],left,y+115);ctx.font='400 22px system-ui';ctx.fillStyle='#554c64';let next=wrapCanvasText(ctx,meta.desc[rtl?1:0],left,y+155,w-220,29,rtl?'right':'left');ctx.fillStyle='#372455';ctx.font='700 22px system-ui';ctx.fillText(L('Score','النتيجة')+`: ${r.scores[sector]}/${r.maximum} · ${pct}%`,left,next+22);ctx.fillStyle='#eae2f4';ctx.fillRect(cardX+45,next+48,cardW-90,20);ctx.fillStyle=s[2];ctx.fillRect(cardX+45,next+48,(cardW-90)*Number(pct)/100,20);ctx.fillStyle='#372455';ctx.font='700 22px system-ui';ctx.fillText(L('Example jobs','أمثلة وظائف')+':',left,next+110);ctx.font='400 21px system-ui';DATA.jobs[sector].forEach((job,i)=>ctx.fillText('• '+job.title[rtl?1:0],left,next+145+i*32));y+=435});ctx.fillStyle='#6f647e';ctx.font='400 18px system-ui';ctx.textAlign=rtl?'right':'left';wrapCanvasText(ctx,L('Exploratory interest signals, not career suitability measurements. Sources are available in the quiz result.','مؤشرات استكشافية للاهتمام وليست قياسًا للملاءمة المهنية. تتوفر المصادر في نتيجة الاختبار.'),left,y+30,w-180,25,rtl?'right':'left');const save=blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='discover-your-future-matches.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};if(canvas.toBlob){canvas.toBlob(blob=>blob&&save(blob),'image/png')}else{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='discover-your-future-matches.png';a.click()}}
render();
